name: Prepare Rust release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binary:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
      - run: cargo build --release --locked
      - run: python3 scripts/license_bundle.py target/third-party
      - name: Package binary and notices
        run: |
          mkdir -p artifact/dependencies
          cp target/release/rosetta LICENSE THIRD_PARTY.md artifact/
          cp -R LICENSES artifact/
          cp -R target/third-party/. artifact/dependencies/
          name="rosetta-$(uname -s)-$(uname -m)"
          tar -czf "$name.tar.gz" -C artifact .
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: '*.tar.gz'
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exportable container image without publishing
        run: |
          docker build -t rosetta:release .
          docker save rosetta:release | gzip > rosetta-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: rosetta-container
          path: rosetta-image.tar.gz
