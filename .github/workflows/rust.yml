name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rosetta_test
          POSTGRES_USER: rosetta
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rosetta -d rosetta_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ROSETTA_TEST_POSTGRES_URL: postgres://rosetta:ci-only-throwaway@localhost:5432/rosetta_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p rosetta --test storage_graph --locked -- --ignored
      - run: cargo build --locked
      - run: python3 tests/transport_matrix.py
      - run: python3 scripts/audit_public.py
      - run: python3 scripts/license_bundle.py target/third-party
      - run: docker build -t rosetta:test .
