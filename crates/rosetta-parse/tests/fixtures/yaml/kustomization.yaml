apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - deployment.yaml
  - https://example.test/remote.yaml
  - github.com/org/repo//deploy?ref=v1
patches:
  - path: patch-replicas.yaml
  - patch: |-
      - op: add
        path: /x
        value: 1
    target:
      kind: Deployment
patchesStrategicMerge:
  - extra.yaml
configMapGenerator:
  - name: app
    files:
      - app.properties
      - renamed=config/app.cfg
secretGenerator:
  - name: s
    envs:
      - secrets.env
